name: Deploy migrations (staging)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packages/db/supabase/migrations/**"]

jobs:
  push:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      # Skip loudly rather than fail, when the deploy is not wired up yet: a
      # workflow that is always red teaches people to ignore red.
      #
      # All three are checked, not just the ref. With only the ref set the job
      # gets as far as `supabase link` and dies on a missing token — a genuine
      # red build reporting an auth error, for a repository that is simply not
      # configured yet. Naming the missing secret is the whole point.
      - id: guard
        run: |
          missing=""
          [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]  && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]  && missing="$missing SUPABASE_DB_PASSWORD"

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging deploy not configured. Missing secrets:$missing. Skipping."
            exit 0
          fi

          # Present but malformed is a different failure from absent, and it
          # must be loud. A wrong-shaped token dies four steps later inside
          # `supabase link`, saying only "Invalid access token format" with no
          # clue which secret or which repository — which is how this workflow
          # ran red on every push for a day and a half while staging quietly
          # fell 13 migrations behind.
          case "${{ secrets.SUPABASE_ACCESS_TOKEN }}" in
            sbp_*) ;;
            *)
              echo "::error::SUPABASE_ACCESS_TOKEN is set but is not a Supabase personal access token (expected an sbp_… value; an anon key or project JWT will not work). Mint one at https://supabase.com/dashboard/account/tokens and set it with: gh secret set SUPABASE_ACCESS_TOKEN"
              exit 1
              ;;
          esac

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.ready == 'true'
        with: { version: latest }

      - name: Link and push migrations
        if: steps.guard.outputs.ready == 'true'
        working-directory: packages/db
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push
