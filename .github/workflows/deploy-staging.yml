name: Deploy migrations (staging)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packages/db/supabase/migrations/**"]

jobs:
  push:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      # Skip loudly rather than fail, when the deploy is not wired up yet: a
      # workflow that is always red teaches people to ignore red.
      #
      # All three are checked, not just the ref. With only the ref set the job
      # gets as far as `supabase link` and dies on a missing token — a genuine
      # red build reporting an auth error, for a repository that is simply not
      # configured yet. Naming the missing secret is the whole point.
      - id: guard
        run: |
          missing=""
          [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]  && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]  && missing="$missing SUPABASE_DB_PASSWORD"

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging deploy not configured. Missing secrets:$missing. Skipping."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.ready == 'true'
        with: { version: latest }

      - name: Link and push migrations
        if: steps.guard.outputs.ready == 'true'
        working-directory: packages/db
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push
