name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap and first: a leaked service-role key is not something to discover
      # after the build passes.
      - name: Secret exposure
        run: pnpm check:secrets

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # typecheck does not catch everything: bundlers resolve modules
      # differently from tsc, and duplicate transitive React only shows up at
      # prerender. Both have bitten this repo already.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-key

  database:
    name: migrations + RLS + UX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The FULL stack, not `db start`. `db start` brings up Postgres alone —
      # enough for RLS tests, which talk to it directly, but there is then no
      # API and no auth for the portal to sign in against, and `status -o env`
      # reports a single key (DB_URL). The UX tests need the real thing.
      - name: Start local Supabase and apply migrations + seed
        working-directory: packages/db
        run: supabase start

      # Policies are only exercised by a real signed-in session: postgres and
      # service_role bypass RLS, and anon matches no policy at all. A missing
      # GRANT that broke every logged-in user once slipped through all three.
      - name: RLS policies
        run: pnpm test:rls
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # UX tests are the only ones that prove a screen works. A unit test
      # proves a rule and an integration test proves a policy; neither notices
      # a form that never submits or a redirect that loops.
      - name: Write local env from the running stack
        run: ./scripts/local-env.sh

      - name: Install Playwright browser
        run: pnpm --filter @picksel/portal exec playwright install chromium --with-deps

      - name: UX (Playwright)
        run: pnpm test:e2e
