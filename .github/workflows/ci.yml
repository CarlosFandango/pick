name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap and first: a leaked service-role key is not something to discover
      # after the build passes.
      - name: Secret exposure
        run: pnpm check:secrets

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # typecheck does not catch everything: bundlers resolve modules
      # differently from tsc, and duplicate transitive React only shows up at
      # prerender. Both have bitten this repo already.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-key

  database:
    name: migrations + RLS policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase and apply migrations + seed
        working-directory: packages/db
        run: supabase db start

      # Policies are only exercised by a real signed-in session: postgres and
      # service_role bypass RLS, and anon matches no policy at all. A missing
      # GRANT that broke every logged-in user once slipped through all three.
      - name: RLS policies
        run: pnpm test:rls
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # UX tests are the only ones that prove a screen works. A unit test
      # proves a rule and an integration test proves a policy; neither notices
      # a form that never submits or a redirect that loops.
      - name: Write portal env from the running stack
        run: |
          set -x
          cd packages/db
          supabase status -o env > /tmp/sb.env || { echo "status failed"; supabase status || true; exit 1; }
          echo "--- keys the CLI reported ---"
          cut -d= -f1 /tmp/sb.env
          cd "$GITHUB_WORKSPACE"
          # shellcheck disable=SC1091
          set -a; . /tmp/sb.env; set +a
          ANON="${ANON_KEY:-${SUPABASE_ANON_KEY:-${PUBLISHABLE_KEY:-}}}"
          SERVICE="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-${SECRET_KEY:-}}}"
          test -n "$ANON" || { echo "no anon key found"; exit 1; }
          printf 'NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
            "$ANON" "$SERVICE" > apps/portal/.env.local
          echo "wrote apps/portal/.env.local"

      - name: Install Playwright browser
        run: pnpm --filter @picksel/portal exec playwright install chromium --with-deps

      - name: UX (Playwright)
        run: pnpm test:e2e
