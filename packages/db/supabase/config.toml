project_id = "picksel"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "picksel://"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# Counter-intuitive but load-bearing: the CLI derives the email PROVIDER flag
# from this key, so setting it false returns `email_provider_disabled` on
# /token and nobody can sign in at all — not just sign up.
# Self-registration is blocked by `enable_signup = false` under [auth] above;
# accounts are created by invitation (a charity onboarded, an auditor approved).
enable_signup = true
enable_confirmations = false

# Log collection (vector + logflare). Off locally: vector needs the Docker
# socket, which colima does not expose at the path the CLI mounts. Nothing in
# PICKsel reads these logs; hosted projects have analytics regardless.
[analytics]
enabled = false

[storage]
enabled = true
file_size_limit = "200MiB"
